<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Una Conversación</title>
<style>
@font-face{font-family:Fraunces;font-style:normal;font-weight:300;src:url(fonts/fraunces-latin-300-normal.woff2)}
@font-face{font-family:Fraunces;font-style:normal;font-weight:400;src:url(fonts/fraunces-latin-400-normal.woff2)}
@font-face{font-family:Fraunces;font-style:italic;font-weight:300;src:url(fonts/fraunces-latin-300-italic.woff2)}
@font-face{font-family:Fraunces;font-style:italic;font-weight:400;src:url(fonts/fraunces-latin-400-italic.woff2)}
@font-face{font-family:Plex;font-weight:400;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2)}
@font-face{font-family:Plex;font-weight:500;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2)}
@font-face{font-family:Plex;font-weight:600;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2)}
@font-face{font-family:Courier;font-weight:400;src:url(fonts/courier-prime-latin-400-normal.woff2)}
@font-face{font-family:Courier;font-weight:700;src:url(fonts/courier-prime-latin-700-normal.woff2)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#070B16;font-family:Plex,monospace;color:#d9dce6}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
.abs{position:absolute}
.serif{font-family:Fraunces,serif;font-style:italic}
.mono{font-family:Plex,monospace}
.caret{display:inline-block;width:.07em;height:1.05em;background:currentColor;vertical-align:-.18em;margin-left:.04em}
.persp{perspective:1500px}
.p3d{transform-style:preserve-3d}

/* dark background */
#bgDark{background:radial-gradient(ellipse 85% 75% at 50% 45%,#131b31 0%,#0a0f1d 55%,#04060c 100%)}
#glow{mix-blend-mode:screen}
#vign{background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#cream{background:radial-gradient(ellipse 70% 65% at 50% 48%,#fbf0d6 0%,#f4ecdd 45%,#e3e7ee 100%)}
#grain{opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* HUD */
.bar{position:absolute;left:0;width:1920px;background:#03040a}
.hud{font:500 19px Plex,monospace;letter-spacing:.14em;color:#b9bdc9;position:absolute;white-space:nowrap}
.hdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:12px;vertical-align:2px}
#hnav span{margin-left:30px}
#hnav i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:3px}

/* chat input */
.box{position:absolute;border-radius:18px;border:1.5px solid rgba(185,198,232,.30);background:rgba(16,22,38,.78);box-shadow:0 0 50px rgba(110,140,255,.08),inset 0 1px 0 rgba(255,255,255,.05)}
.boxtxt{position:absolute;left:36px;top:0;height:100%;display:flex;align-items:center;font:400 38px Plex,monospace;color:#dfe2ea;white-space:pre}
.send{position:absolute;width:56px;height:56px;border-radius:50%;background:#E07A55;box-shadow:0 0 22px rgba(224,122,85,.45);display:flex;align-items:center;justify-content:center}
.send svg{width:26px;height:26px}

/* windows of the old way */
.win{position:absolute;border-radius:14px;background:linear-gradient(180deg,rgba(28,34,52,.96),rgba(18,23,38,.96));border:1px solid rgba(255,255,255,.10);box-shadow:0 30px 60px rgba(0,0,0,.55);font-family:Plex,monospace;color:#cfd3de;overflow:hidden}
.wdots{position:absolute;left:18px;top:14px;letter-spacing:4px;color:#59607a;font-size:20px}
.tag{position:absolute;font:600 15px Plex;letter-spacing:.12em;color:#ff6b6b;border:1.5px solid #e2474f;border-radius:5px;padding:4px 12px;background:rgba(80,10,20,.55)}
.gbar{position:absolute;height:22px;border-radius:5px;background:rgba(120,130,160,.22)}
.lbl{font:500 16px Plex;letter-spacing:.2em;color:#8a91a6}

/* role titles */
.rtitle{position:absolute;font:400 italic 112px/1 Fraunces,serif;white-space:nowrap;letter-spacing:-.01em}
.ridx{position:absolute;font:500 22px Plex,monospace;letter-spacing:.14em;white-space:nowrap}

/* screenplay */
#paper{position:absolute;left:250px;top:215px;width:1080px;height:690px;border-radius:14px;border:1.5px solid rgba(255,181,71,.55);background:linear-gradient(160deg,rgba(32,36,56,.96),rgba(12,15,26,.97));box-shadow:0 0 40px rgba(255,181,71,.16),0 40px 80px rgba(0,0,0,.6);font:400 33px/1.5 Courier,monospace;color:#ece6d8;padding:62px 80px}
#paper .ln{min-height:52px;white-space:pre}
.amber{color:#FFB547;font-weight:700;text-shadow:0 0 14px rgba(255,181,71,.45)}
.pill{display:inline-block;background:#FFB547;color:#1d1405;font-weight:700;padding:0 14px;border-radius:7px;box-shadow:0 0 18px rgba(255,181,71,.55)}

/* art */
.card{position:absolute;border-radius:16px;background:rgba(10,12,22,.88);border:1.3px solid rgba(255,92,138,.38);overflow:hidden}
.card .pd{position:absolute;left:50%;top:12px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:#FF5C8A;box-shadow:0 0 10px #FF5C8A}
.card .cl{position:absolute;left:22px;bottom:18px;font:500 19px Plex;letter-spacing:.16em;color:#c8bcc6}
.sw{position:absolute;width:92px;height:92px;border-radius:50%}
.swl{position:absolute;font:500 15px Plex;color:#c9b8c4;letter-spacing:.04em;white-space:nowrap}

/* pads */
.pad{position:absolute;border-radius:12px;border:1.3px solid rgba(200,240,90,.22);background:rgba(14,18,16,.82);overflow:hidden}
.pad .pl{position:absolute;left:16px;top:12px;font:500 17px Plex;color:#d9e6b8;letter-spacing:.04em}
.pad svg{position:absolute;left:0;top:0}
.meter{position:absolute;right:12px;bottom:14px;width:7px;border-radius:3px;background:#C8F05A;box-shadow:0 0 10px #C8F05A}

/* editor */
.clip{position:absolute;top:0;height:78px;border-radius:7px;overflow:hidden;font:500 17px/1.35 Plex;padding:7px 10px;white-space:nowrap;border-bottom:3px solid}
.trk{position:absolute;left:0;font:500 18px Plex;color:#8790a8}

/* render grid */
.cell{position:absolute;width:190px;height:107px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.035);border:1px solid rgba(255,216,107,.16)}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .fl{position:absolute;inset:0;background:#fff5dc}

/* climax / resolve */
.bigcard{position:absolute;width:1150px;height:647px;border-radius:12px;overflow:hidden;box-shadow:0 40px 80px rgba(60,45,25,.35)}
.bigcard img,.ocard img{width:100%;height:100%;object-fit:cover;display:block}
.ocard{position:absolute;width:300px;height:169px;border-radius:8px;overflow:hidden;box-shadow:0 18px 36px rgba(60,45,25,.3)}
.ctag{position:absolute;font:600 16px Plex;letter-spacing:.22em;white-space:nowrap}
.ctag i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:10px;vertical-align:1px}
.credit{position:absolute;font:300 italic 31px Fraunces,serif;color:#33323b;white-space:nowrap}
.credit i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:12px;vertical-align:5px}
#chat{position:absolute;left:460px;top:90px;width:1000px;height:530px;border-radius:24px;background:#fbf7ef;box-shadow:0 30px 70px rgba(80,60,30,.18);border:1px solid rgba(0,0,0,.05)}
.bub{position:absolute;right:42px;background:#ece6da;border-radius:14px;padding:12px 24px;font:400 24px Plex;color:#3a3833;white-space:nowrap}
.chip{display:inline-block;margin:0 12px 14px 0;border:1px solid rgba(0,0,0,.09);background:#f6f1e6;border-radius:22px;padding:8px 18px;font:500 20px Plex;color:#3a3833}
.chip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px;vertical-align:1px}
</style>
</head>
<body>
<div id="stage"></div>
<script src="textos.js"></script>
<script src="film.js"></script>
</body>
</html>
