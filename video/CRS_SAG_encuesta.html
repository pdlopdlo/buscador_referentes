<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #ffffff;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .abs { position: absolute; }
      svg { overflow: visible; }
      .limb-back { filter: brightness(0.82); }

      /* ---------- intro ---------- */
      #intro { transform-origin: 960px 420px; }
      #logo-rs { position: absolute; left: 900px; top: 175px; font-weight: 900; font-size: 330px;
        line-height: 1; color: #0b6b38; letter-spacing: -6px; }
      #lema { position: absolute; left: 0; width: 1920px; top: 545px; text-align: center;
        font-weight: 800; font-size: 74px; letter-spacing: 18px; color: #0b6b38; padding-left: 18px; }
      #lema span { color: #3dba3a; }
      #subtitle { position: absolute; left: 0; width: 1920px; top: 652px; text-align: center;
        font-weight: 800; font-size: 34px; color: #0b6b38; }
      #subtitle span { color: #3dba3a; }
      #row { position: absolute; left: 0; top: 735px; width: 2600px; height: 230px; }
      #btn { position: absolute; left: 885px; top: 1000px; width: 150px; height: 42px; border-radius: 21px;
        background: #0b6b38; color: #fff; font-weight: 800; font-size: 22px; display: flex;
        align-items: center; gap: 12px; padding-left: 8px; }
      #btn i { width: 28px; height: 28px; border-radius: 50%; background: #fff; display: block; position: relative; }
      #btn i::after { content: ""; position: absolute; left: 11px; top: 7px; width: 6px; height: 11px;
        border: 3px solid #0b6b38; border-radius: 4px; }

      #cwrap { position: absolute !important; left: 0 !important; top: 0 !important; width: 0 !important; height: 0 !important; }

      /* ---------- final scene ---------- */
      #sky { background: radial-gradient(ellipse 62% 70% at 54% 50%, #ffffff 0%, #eef8fd 38%, #a9dcf4 78%, #6cc4ec 100%); }
      #scene { transform-origin: 1110px 600px; }
      #message { position: absolute; left: 70px; top: 690px; width: 430px; font-weight: 800; font-size: 27px;
        line-height: 1.32; color: #16324f; letter-spacing: 0.2px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.75" data-width="1920" data-height="1080">

      <!-- final scene background -->
      <div id="sky" class="layer clip" data-start="0" data-duration="4.75" data-track-index="0"></div>

      <!-- dune (camino) -->
      <svg id="dune" class="layer clip" data-start="0" data-duration="4.75" data-track-index="1" viewBox="0 0 1920 1080">
        <defs>
          <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f1d5a8" />
            <stop offset="1" stop-color="#e4c08a" />
          </linearGradient>
          <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="4" />
            <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.25  0 0 0 0.16 0" />
            <feComposite in2="SourceGraphic" operator="in" /><feBlend in="SourceGraphic" mode="multiply" /></filter>
        </defs>
        <path filter="url(#grain)" fill="url(#sand)"
          d="M -40 1100 C 300 960, 820 700, 1060 540 C 1110 505, 1135 488, 1152 494 C 1172 500, 1190 540, 1250 600 C 1420 770, 1720 960, 1960 1100 Z" />
      </svg>

      <!-- final scene: path, C-hospital, characters -->
      <div id="scene" class="layer clip" data-start="0" data-duration="4.75" data-track-index="2">
        <svg id="scene-svg" class="layer" viewBox="0 0 1920 1080"></svg>
        <div id="scene-people" class="layer"></div>
      </div>

      <!-- clouds, plane -->
      <svg id="sky-deco" class="layer clip" data-start="0" data-duration="4.75" data-track-index="3" viewBox="0 0 1920 1080"></svg>
      <div id="message" class="clip" data-start="0" data-duration="4.75" data-track-index="4">SE CONSULTARÁ A LOS PACIENTES COMO EVALÚA LOS ASPECTOS GENERALES</div>

      <!-- blurry silhouette seen through the hole -->
      <div id="ghost" class="abs clip" data-start="0" data-duration="4.75" data-track-index="5" style="left:880px; top:420px; width:160px; height:220px;"></div>

      <!-- intro -->
      <div id="intro" class="layer clip" data-start="0" data-duration="4.75" data-track-index="6">
        <div id="logo-rs">RS</div>
        <div id="lema">S<span>A</span>G</div>
        <div id="subtitle">Encuesta trato <span>usuario</span></div>
        <div id="row"></div>
        <div id="btn"><i></i>2026</div>
      </div>

      <!-- the big C (logo letter that we fly through) -->
      <div id="cwrap" class="clip" data-start="0" data-duration="4.75" data-track-index="7"></div>

      <!-- ICONO01 particles -->
      <div id="icons" class="layer clip" data-start="0" data-duration="4.75" data-track-index="8"></div>
    </div>

    <script>
      // ---------- helpers ----------
      const NS = "http://www.w3.org/2000/svg";
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; // deterministic
      const rad = (d) => (d * Math.PI) / 180;

      function cPath(R, r, a) {
        const p = (rr, ang) => `${(rr * Math.cos(rad(ang))).toFixed(1)} ${(rr * Math.sin(rad(ang))).toFixed(1)}`;
        return `M ${p(R, a)} A ${R} ${R} 0 1 1 ${p(R, -a)} L ${p(r, -a)} A ${r} ${r} 0 1 0 ${p(r, a)} Z`;
      }

      const ICON = `<svg viewBox="0 0 100 100" width="100%" height="100%">
        <rect x="4" y="6" width="92" height="92" rx="24" fill="#000" opacity=".08"/>
        <rect x="4" y="2" width="92" height="92" rx="24" fill="#dff1eb"/>
        <rect x="33" y="27" width="34" height="46" rx="6" fill="none" stroke="#2f6f62" stroke-width="4.5"/>
        <rect x="41" y="21" width="18" height="11" rx="3.5" fill="#dff1eb" stroke="#2f6f62" stroke-width="4.5"/>
        <rect x="40" y="41" width="6" height="6" rx="1.5" fill="#2f6f62"/><line x1="51" y1="44" x2="60" y2="44" stroke="#2f6f62" stroke-width="4" stroke-linecap="round"/>
        <rect x="40" y="52" width="6" height="6" rx="1.5" fill="#2f6f62"/><line x1="51" y1="55" x2="60" y2="55" stroke="#2f6f62" stroke-width="4" stroke-linecap="round"/>
        <rect x="40" y="63" width="6" height="6" rx="1.5" fill="#2f6f62"/><line x1="51" y1="66" x2="60" y2="66" stroke="#2f6f62" stroke-width="4" stroke-linecap="round"/>
      </svg>`;

      // ---------- characters ----------
      // feet at (0,0); hip -92; shoulder -158; head -186
      function personSVG(o) {
        const skin = o.skin || "#e9b48f";
        const sleeve = o.sleeve || o.top;
        const shoe = o.shoe || "#1d2233";
        const leg = (cls) => `<g class="${cls}"><rect x="-10" y="-96" width="21" height="90" rx="10" fill="${o.pants}"/>
          <path d="M -9 -10 h 28 a 6 6 0 0 1 0 10 h -28 z" fill="${shoe}"/></g>`;
        const arm = (cls, extra = "") => `<g class="${cls}"><rect x="-8" y="-160" width="17" height="70" rx="8.5" fill="${sleeve}"/>
          <circle cx="0.5" cy="-88" r="8" fill="${skin}"/>${extra}</g>`;
        let hair = "";
        if (o.hair === "long") hair = `<path d="M -21 -190 a 21 22 0 0 1 42 0 v 34 q -21 10 -42 0 z" fill="${o.hairColor}"/>`;
        if (o.hair === "short") hair = `<path d="M -20 -188 a 20 21 0 0 1 40 -2 q -12 -6 -24 -2 q -8 3 -16 4 z" fill="${o.hairColor}"/>`;
        if (o.hair === "bun") hair = `<circle cx="-14" cy="-206" r="9" fill="${o.hairColor}"/><path d="M -20 -186 a 20 21 0 0 1 40 -4 q -20 -4 -40 4 z" fill="${o.hairColor}"/>`;
        let hat = "";
        if (o.cap) hat = `<path d="M -19 -197 q 19 -20 38 0 l 0 6 h -38 z" fill="${o.cap}"/><rect x="2" y="-197" width="22" height="6" rx="3" fill="${o.cap}"/>`;
        if (o.nurseCap) hat = `<path d="M -15 -203 h 30 l -4 12 h -22 z" fill="#ffffff" stroke="#d9dde3" stroke-width="1.5"/><path d="M -3 -201 h 6 v 3 h 3 v 4 h -3 v 3 h -6 v -3 h -3 v -4 h 3 z" fill="#e2445c"/>`;
        let torso = `<rect x="-24" y="-170" width="48" height="84" rx="17" fill="${o.top}"/>`;
        if (o.coat) torso = `<rect x="-24" y="-170" width="48" height="84" rx="17" fill="${o.shirt || "#a8d4ef"}"/>
          <path d="M -27 -150 q 0 -22 18 -22 l 9 30 l 9 -30 q 18 0 18 22 v 92 h -54 z" fill="${o.coat}" stroke="#d5dbe1" stroke-width="2"/>
          <rect x="10" y="-120" width="10" height="13" rx="2" fill="#7fb6d9"/>`;
        if (o.suit) torso += `<path d="M -7 -170 l 7 22 l 7 -22 z" fill="#fff"/><path d="M -2 -160 h 4 l 2 26 l -4 5 l -4 -5 z" fill="#c23a4a"/>`;
        if (o.scrub) torso += `<path d="M -10 -170 l 10 16 l 10 -16" stroke="${o.scrub}" stroke-width="4" fill="none"/>`;
        let steth = o.steth ? `<path d="M -12 -168 q -4 32 12 34 q 16 -2 12 -34" stroke="#2c3e57" stroke-width="3.5" fill="none"/><circle cx="0" cy="-131" r="5" fill="#9aa7b4"/>` : "";
        let front = "";
        if (o.cane) front = `<line x1="2" y1="-90" x2="16" y2="-2" stroke="#6d4a2b" stroke-width="5" stroke-linecap="round"/><path d="M 2 -90 q -2 -10 9 -10" stroke="#6d4a2b" stroke-width="5" fill="none" stroke-linecap="round"/>`;
        if (o.clipboard) front = `<rect x="-6" y="-104" width="24" height="30" rx="3" fill="#f3f5f7" stroke="#2f6f62" stroke-width="2.5"/>`;
        if (o.briefcase) front = `<rect x="-14" y="-82" width="32" height="24" rx="4" fill="#7a4a24"/><path d="M -4 -82 v -5 h 12 v 5" stroke="#7a4a24" stroke-width="3" fill="none"/>`;
        return `<svg viewBox="-70 -230 140 240" width="100%" height="100%"><g class="flip" ${o.left ? 'transform="scale(-1,1)"' : ""}>
          <g class="bob"><g class="lean">
            <g class="limb-back">${leg("legB")}${arm("armB")}</g>
            <g class="torso">${torso}${steth}<rect x="-6" y="-176" width="12" height="10" fill="${skin}"/>
              ${o.hair === "long" ? hair : ""}<circle cx="0" cy="-186" r="19" fill="${skin}"/>${o.hair !== "long" ? hair : ""}${hat}
              <circle cx="11" cy="-188" r="2.2" fill="#2a1d18" opacity=".7"/></g>
            ${leg("legF")}${arm("armF", front)}
          </g></g></g></svg>`;
      }

      function addPerson(container, o) {
        const d = document.createElement("div");
        d.className = "abs person";
        d.id = o.id;
        const h = o.h, w = (h * 140) / 240;
        d.style.cssText = `left:${o.x - w / 2}px; top:${o.y - (h * 230) / 240}px; width:${w}px; height:${h}px;`;
        d.innerHTML = personSVG(o);
        container.appendChild(d);
        return d;
      }

      const tl = gsap.timeline({ paused: true });
      const END = 4.75;

      function walk(el, o) {
        const p = o.period || 0.32, amp = o.amp || 26;
        const n = Math.ceil(END / p) + 1, t0 = -(o.phase || 0) * p;
        const q = (s) => el.querySelector(s);
        const sw = (sel, origin, a) =>
          tl.fromTo(q(sel), { rotation: a, svgOrigin: origin }, { rotation: -a, svgOrigin: origin, duration: p,
            ease: "sine.inOut", repeat: n, yoyo: true }, Math.max(0, t0));
        sw(".legF", "0 -92", amp);
        sw(".legB", "0 -92", -amp);
        if (o.wave) {
          tl.fromTo(q(".armF"), { rotation: -150, svgOrigin: "0 -154" }, { rotation: -185, svgOrigin: "0 -154",
            duration: 0.22, ease: "sine.inOut", repeat: Math.ceil(END / 0.22), yoyo: true }, 0);
        } else if (o.jump) {
          tl.set(q(".armF"), { rotation: -150, svgOrigin: "0 -154" }, 0);
          tl.set(q(".armB"), { rotation: -120, svgOrigin: "0 -154" }, 0);
        } else {
          sw(".armF", "0 -154", -amp * 0.9);
        }
        if (!o.jump) sw(".armB", "0 -154", amp * 0.9);
        tl.fromTo(q(".bob"), { y: 0 }, { y: o.jump ? -26 : -5, duration: p / 2, ease: "sine.inOut",
          repeat: n * 2, yoyo: true }, Math.max(0, t0));
        if (o.lean) tl.set(q(".lean"), { rotation: o.lean, svgOrigin: "0 0" }, 0);
      }

      // ---------- intro: row of clinical staff ----------
      const staff = [
        { top: "#1f2a5a", pants: "#1f2a5a", hair: "bun", hairColor: "#3b2a22", scrub: "#2f3d78" },           // enfermera azul marino
        { coat: "#f7f9fb", shirt: "#9fd0ee", top: "#f7f9fb", pants: "#25345c", hair: "short", hairColor: "#2b2b2b", steth: 1, clipboard: 1 }, // doctor
        { top: "#8fd3f4", pants: "#8fd3f4", hair: "long", hairColor: "#5a3a26", scrub: "#6bbde6", skin: "#f1c6a3" }, // enfermera celeste
        { top: "#1b1b1f", sleeve: "#1b1b1f", pants: "#1b1b1f", hair: "short", hairColor: "#6b4a33", suit: 1, briefcase: 1, skin: "#c98f6c" }, // administrativo
        { top: "#d9378f", pants: "#d9378f", hair: "bun", hairColor: "#1e1a19", nurseCap: 1, scrub: "#b72674", skin: "#d9a07c" }, // enfermera fucsia
        { coat: "#f7f9fb", shirt: "#c7e1f2", top: "#f7f9fb", pants: "#3b4252", hair: "long", hairColor: "#b07b45", steth: 1 }, // doctora
        { top: "#1f2a5a", pants: "#1f2a5a", hair: "short", hairColor: "#1b1b1b", scrub: "#2f3d78", skin: "#b67c5b" },
        { top: "#1b1b1f", sleeve: "#1b1b1f", pants: "#1b1b1f", hair: "long", hairColor: "#2a1f1a", suit: 1, clipboard: 1 },
        { top: "#8fd3f4", pants: "#8fd3f4", hair: "short", hairColor: "#3a2a20", scrub: "#6bbde6" },
        { top: "#d9378f", pants: "#d9378f", hair: "long", hairColor: "#4a2e20", scrub: "#b72674", skin: "#f1c6a3" },
      ];
      const row = document.getElementById("row");
      const rowPeople = [];
      for (let i = 0; i < 22; i++) {
        const o = Object.assign({}, staff[i % staff.length], { id: `rp${i}`, x: 40 + i * 118, y: 205, h: 190, left: true });
        o.jump = i % 4 === 1;
        o.phase = (i * 0.37) % 1;
        rowPeople.push(addPerson(row, o));
        walk(rowPeople[i], { phase: o.phase, jump: o.jump, period: 0.3 });
      }
      tl.fromTo(row, { x: 0 }, { x: -330, duration: 1.3, ease: "none" }, 0);

      // ---------- the C ----------
      const cwrap = document.getElementById("cwrap");
      cwrap.innerHTML = `<svg viewBox="-150 -150 300 300" width="300" height="300" style="position:absolute;left:-150px;top:-150px">
        <defs><clipPath id="cclip"><path d="${cPath(145, 62, 40)}"/></clipPath></defs>
        <g clip-path="url(#cclip)">
          <rect x="-150" y="-150" width="300" height="300" fill="#41b9e6"/>
          <path d="M -150 -40 Q 0 -95 150 -110 V 150 H -150 Z" fill="#3dba3a"/>
          <path d="M -150 120 Q 10 30 150 -20 V 150 H -150 Z" fill="#0a6b37"/>
        </g></svg>`;
      // logo position: center (765, 340)
      tl.set(cwrap, { x: 740, y: 340, scale: 1, transformOrigin: "0px 0px", width: 0, height: 0 }, 0);

      // ---------- sky decorations ----------
      const deco = document.getElementById("sky-deco");
      const cloud = (id, x, y, s) => `<g id="${id}" transform="translate(${x} ${y}) scale(${s})"><g class="c">
        <ellipse cx="0" cy="12" rx="120" ry="34" fill="#ffffff"/><circle cx="-45" cy="-4" r="42" fill="#ffffff"/>
        <circle cx="20" cy="-22" r="56" fill="#ffffff"/><circle cx="70" cy="2" r="36" fill="#ffffff"/>
        <ellipse cx="0" cy="34" rx="112" ry="10" fill="#d7eef9" opacity=".7"/></g></g>`;
      deco.innerHTML = cloud("cl1", 210, 430, 1.05) + cloud("cl2", 1730, 300, 0.9) + cloud("cl3", 640, 170, 0.75) + cloud("cl4", 1520, 760, 0.7) +
        `<g id="plane" transform="translate(1800 520)"><g class="p" transform="scale(1.3)">
          <path d="M -40 0 q 30 -8 72 -4 q 10 2 6 8 q -40 6 -78 2 z" fill="#b9c8d6"/>
          <path d="M -2 -3 l 22 -22 h 8 l -10 24 z" fill="#93a6b9"/><path d="M -36 -2 l -8 -14 h 7 l 12 13 z" fill="#93a6b9"/>
          <circle cx="24" cy="-1" r="2.5" fill="#5b7186"/></g></g>`;

      // ---------- final scene ----------
      const ssvg = document.getElementById("scene-svg");
      const CX = 1110, CY = 560, R = 560, r = 225;
      // floor tile lines radiating from vanishing point
      let floorLines = "", ceilLines = "";
      for (let i = -9; i <= 9; i++) floorLines += `<line x1="0" y1="40" x2="${i * 80}" y2="600" stroke="#c6ddd6" stroke-width="3"/>`;
      for (let k = 0; k < 6; k++) { const y = 70 + k * k * 18 + k * 40; floorLines += `<line x1="-600" y1="${y}" x2="600" y2="${y}" stroke="#c6ddd6" stroke-width="3"/>`; }
      for (let k = 0; k < 5; k++) { const y = -240 - k * 70, w = 60 + k * 50; ceilLines += `<path d="M ${-w} ${y} h ${2 * w} l ${12 + k * 6} -26 h ${-2 * w - 2 * (12 + k * 6)} z" fill="#fffbe8" stroke="#e7e1c2" stroke-width="2"/>`; }
      ssvg.innerHTML = `
        <defs><clipPath id="ring"><path d="${cPath(R, r, 38)}"/></clipPath>
          <linearGradient id="wallL" x1="0" x2="1"><stop offset="0" stop-color="#a7dccd"/><stop offset="1" stop-color="#cdeee5"/></linearGradient>
          <linearGradient id="wallR" x1="1" x2="0"><stop offset="0" stop-color="#93cfc0"/><stop offset="1" stop-color="#c3e9de"/></linearGradient></defs>
        <g id="cring" transform="translate(${CX} ${CY})">
          <g clip-path="url(#ring)">
            <rect x="-600" y="-600" width="1200" height="1200" fill="#cdeee5"/>
            <!-- ceiling -->
            <path d="M -600 -600 H 600 L 140 -170 H -140 Z" fill="#f4fbf9"/>${ceilLines}
            <!-- walls -->
            <path d="M -600 -600 L -140 -170 V 40 L -600 600 Z" fill="url(#wallL)"/>
            <path d="M 600 -600 L 140 -170 V 40 L 600 600 Z" fill="url(#wallR)"/>
            <!-- floor -->
            <path d="M -600 600 L -140 40 H 140 L 600 600 Z" fill="#e6f2ee"/><g clip-path="none">${floorLines}</g>
            <path d="M -600 600 L -140 40 H 140 L 600 600 Z" fill="none"/>
            <!-- doors left -->
            <path d="M -470 -330 L -360 -250 V 230 L -470 350 Z" fill="#3f93b6"/><path d="M -455 -300 L -375 -242 V -80 L -455 -110 Z" fill="#9ed6ef"/>
            <path d="M -300 -200 L -235 -152 V 120 L -300 175 Z" fill="#3f93b6"/>
            <!-- doors right -->
            <path d="M 470 -330 L 360 -250 V 230 L 470 350 Z" fill="#2f7fa2"/>
            <path d="M 300 -200 L 235 -152 V 120 L 300 175 Z" fill="#2f7fa2"/>
            <!-- skirting -->
            <path d="M -600 600 L -140 40 L -140 30 L -600 570 Z" fill="#5fa99a"/><path d="M 600 600 L 140 40 L 140 30 L 600 570 Z" fill="#5fa99a"/>
            <!-- cross sign (sala de atención) -->
            <g transform="translate(-180 -400)"><rect x="-70" y="-38" width="140" height="76" rx="14" fill="#ffffff"/>
              <path d="M -12 -26 h 24 v 14 h 14 v 24 h -14 v 14 h -24 v -14 h -14 v -24 h 14 z" fill="#e2445c" transform="translate(-30 0)"/>
              <rect x="10" y="-10" width="44" height="8" rx="4" fill="#2f6f62"/><rect x="10" y="6" width="32" height="8" rx="4" fill="#2f6f62"/></g>
            <!-- sala de atención: mesón + monitor + silla -->
            <g transform="translate(-390 120)">
              <rect x="-140" y="-10" width="260" height="120" rx="10" fill="#ffffff"/><rect x="-150" y="-26" width="280" height="22" rx="8" fill="#2f6f62"/>
              <rect x="-60" y="-110" width="110" height="74" rx="8" fill="#1f3047"/><rect x="-52" y="-102" width="94" height="58" rx="5" fill="#7fd0ef"/>
              <rect x="-12" y="-38" width="14" height="14" fill="#1f3047"/>
              <rect x="-120" y="20" width="200" height="10" rx="5" fill="#d4e8e2"/>
            </g>
            <!-- camilla -->
            <g transform="translate(330 300)">
              <line x1="140" y1="-220" x2="140" y2="110" stroke="#9aa9b5" stroke-width="7"/><rect x="118" y="-232" width="40" height="56" rx="10" fill="#e8f6ff" stroke="#9cc9e6" stroke-width="3"/>
              <line x1="138" y1="-176" x2="80" y2="-40" stroke="#9cc9e6" stroke-width="3"/>
              <rect x="-160" y="-50" width="280" height="14" rx="7" fill="#9aa9b5"/>
              <rect x="-150" y="-78" width="260" height="32" rx="14" fill="#ffffff"/><rect x="-80" y="-84" width="190" height="40" rx="14" fill="#5fbbe2"/>
              <ellipse cx="-118" cy="-84" rx="36" ry="16" fill="#ffffff" stroke="#dbe5ec" stroke-width="2"/>
              <line x1="-130" y1="-36" x2="-130" y2="60" stroke="#9aa9b5" stroke-width="7"/><line x1="90" y1="-36" x2="90" y2="60" stroke="#9aa9b5" stroke-width="7"/>
              <circle cx="-130" cy="70" r="13" fill="#3b4a5a"/><circle cx="90" cy="70" r="13" fill="#3b4a5a"/>
            </g>
          </g>
        </g>
        <!-- path (camino) -->
        <path id="camino" filter="url(#grain)" fill="#ecc993"
          d="M 930 1090 C 960 990, 840 930, 900 860 C 960 790, 1085 790, 1098 742 L 1122 742 C 1130 800, 1050 840, 1080 900 C 1120 980, 1380 1010, 1520 1090 Z"/>`;

      const people = document.getElementById("scene-people");
      const woman = addPerson(people, { id: "woman", x: 1180, y: 1060, h: 300, left: true, top: "#c9532d", pants: "#2d3566", hair: "long", hairColor: "#2a1c17", skin: "#efbe98" });
      const oldman = addPerson(people, { id: "oldman", x: 990, y: 905, h: 205, left: true, top: "#5b7fb9", sleeve: "#5b7fb9", pants: "#6b5a4a", hair: "short", hairColor: "#d9d9d9", cane: 1, skin: "#e2ad88", shoe: "#4a3424" });
      const waver = addPerson(people, { id: "waver", x: 1082, y: 790, h: 130, left: true, top: "#f08a24", pants: "#2d3566", hair: "short", hairColor: "#3a2a1f", cap: "#ffffff", skin: "#c98f6c" });
      walk(woman, { period: 0.34, amp: 30 });
      walk(oldman, { period: 0.42, amp: 16, lean: -9 });
      walk(waver, { period: 0.3, amp: 18, wave: 1 });

      // ghost silhouette in the hole
      const ghost = document.getElementById("ghost");
      ghost.innerHTML = personSVG({ top: "#c9d6e6", pants: "#c9d6e6", sleeve: "#c9d6e6", skin: "#e8d6c8", left: true, shoe: "#c9d6e6" });
      walk(ghost, { period: 0.3 });

      // ---------- ICONO01 particles ----------
      const icons = document.getElementById("icons");
      const PEAK = [1152, 500];
      const iconEls = [];
      for (let i = 0; i < 20; i++) {
        const d = document.createElement("div");
        const s = 34 + rnd() * 70;
        d.className = "abs";
        d.style.cssText = `left:${-s / 2}px; top:${-s / 2}px; width:${s}px; height:${s}px;`;
        d.innerHTML = ICON;
        icons.appendChild(d);
        iconEls.push(d);
        const ang = -150 + rnd() * 160, dist = 260 + rnd() * 620;
        const tx = PEAK[0] + Math.cos(rad(ang)) * dist, ty = PEAK[1] + Math.sin(rad(ang)) * dist * 0.75;
        const rot0 = rnd() * 360, spin = (rnd() > 0.5 ? 1 : -1) * (300 + rnd() * 360);
        const start = 1.92 + rnd() * 0.25;
        tl.set(d, { x: PEAK[0], y: PEAK[1], scale: 0.1, opacity: 0, rotation: rot0 }, 0);
        tl.to(d, { opacity: 1, scale: 1, duration: 0.15, ease: "power1.out" }, start);
        tl.to(d, { x: tx, y: ty, rotation: rot0 + spin, duration: 0.55, ease: "power3.out" }, start);
        // slow float + gentle fall
        tl.to(d, { x: tx - 40 - rnd() * 80, y: ty + 140 + rnd() * 160, rotation: rot0 + spin * 1.25, duration: 2.2, ease: "none" }, start + 0.55);
        if (i % 3 !== 0) tl.to(d, { opacity: 0, duration: 0.3 }, 2.75 + rnd() * 0.4);
      }
      // late falling icons (3.6 – 4.75)
      for (let i = 0; i < 6; i++) {
        const d = document.createElement("div");
        const s = 40 + rnd() * 34;
        d.className = "abs";
        d.style.cssText = `left:${-s / 2}px; top:${-s / 2}px; width:${s}px; height:${s}px;`;
        d.innerHTML = ICON;
        icons.appendChild(d);
        const x0 = [180, 560, 1500, 1760, 820, 1380][i];
        tl.set(d, { x: x0, y: -80, rotation: rnd() * 90, opacity: 0 }, 0);
        tl.to(d, { opacity: 1, duration: 0.15 }, 3.45 + i * 0.12);
        tl.to(d, { x: x0 - 120, y: 520 + rnd() * 500, rotation: "+=" + (160 + rnd() * 200), duration: 1.6, ease: "none" }, 3.45 + i * 0.12);
      }
      // big icon in foreground
      const big = document.createElement("div");
      big.className = "abs"; big.style.cssText = "left:-110px; top:-110px; width:220px; height:220px;";
      big.innerHTML = ICON; icons.appendChild(big);
      tl.set(big, { x: 420, y: 860, rotation: -30, opacity: 0, scale: 0.7 }, 0);
      tl.to(big, { opacity: 1, scale: 1, duration: 0.15 }, 2.78);
      tl.to(big, { x: 60, y: 1180, rotation: -110, scale: 1.25, duration: 0.75, ease: "power1.in" }, 2.78);

      // ---------- master choreography ----------
      const intro = document.getElementById("intro");
      // 0.75: zoom starts, row drifts down
      tl.to(intro, { scale: 1.14, duration: 0.5, ease: "power1.in" }, 0.62);
      tl.to(row, { y: 150, opacity: 0, duration: 0.45, ease: "power1.in" }, 0.68);
      tl.to("#btn", { opacity: 0, duration: 0.2 }, 0.65);
      // 1.0: R, S and texts dissolve; C grows to centre
      tl.to("#logo-rs", { opacity: 0, x: 160, filter: "blur(10px)", duration: 0.28, ease: "power1.in" }, 0.7);
      tl.to(["#lema", "#subtitle"], { opacity: 0, y: 140, scale: 1.6, filter: "blur(10px)", duration: 0.35, ease: "power1.in" }, 0.76);
      tl.to(cwrap, { x: 960, y: 520, scale: 2.5, duration: 0.3, ease: "power2.inOut" }, 0.78);
      // 1.25: fly into the hole
      tl.to(cwrap, { scale: 22, duration: 0.42, ease: "power3.in" }, 1.05);
      tl.set(cwrap, { opacity: 0 }, 1.47);
      // ghost walker inside the hole
      tl.fromTo(ghost, { opacity: 0, scale: 0.8, filter: "blur(5px)" }, { opacity: 0.4, scale: 1.4, duration: 0.25, ease: "none" }, 1.05);
      tl.to(ghost, { opacity: 0, scale: 2.6, filter: "blur(14px)", duration: 0.2, ease: "power1.in" }, 1.3);
      // dune appears behind and grows (camino)
      const dune = document.getElementById("dune");
      tl.fromTo(dune, { opacity: 0, scale: 0.55, transformOrigin: "1152px 600px" }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 1.2);
      tl.to(dune, { scale: 1.05, duration: 0.4, ease: "none" }, 1.53);
      // 2.0 – 2.25: dune dissolves while icons burst
      tl.to(dune, { opacity: 0, y: 60, filter: "blur(6px)", duration: 0.5, ease: "power1.in" }, 1.98);
      // 2.5 – 3.0: final scene fades in, zooms out
      const scene = document.getElementById("scene");
      const sky = document.getElementById("sky");
      tl.set(sky, { opacity: 0 }, 0);
      tl.set(scene, { opacity: 0, scale: 2.1, x: 120, y: -120 }, 0);
      tl.set("#cring", { opacity: 0 }, 0);
      tl.to(scene, { opacity: 0.25, duration: 0.3, ease: "none" }, 2.5);
      tl.to(scene, { opacity: 1, duration: 0.25, ease: "none" }, 2.8);
      tl.to(sky, { opacity: 1, duration: 0.35, ease: "power1.out" }, 2.72);
      tl.to(scene, { scale: 1, x: 0, y: 0, duration: 1.15, ease: "power2.out" }, 2.6);
      // 3.25 – 3.5: the C re-forms and turns into the hospital
      tl.fromTo("#cring", { opacity: 0, scale: 0.8, svgOrigin: `${CX} ${CY}` },
        { opacity: 1, scale: 1, svgOrigin: `${CX} ${CY}`, duration: 0.42, ease: "back.out(1.4)" }, 3.12);
      tl.fromTo(waver, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.3);
      // 3.75: clouds + message
      ["#cl1", "#cl2", "#cl3", "#cl4"].forEach((c, i) => {
        tl.fromTo(c + " .c", { opacity: 0, x: -60 * (i % 2 ? -1 : 1), scale: 0.85 },
          { opacity: 1, x: 0, scale: 1, duration: 0.45, ease: "power2.out" }, 3.38 + i * 0.07);
        tl.to(c + " .c", { x: i % 2 ? -26 : 26, duration: 1, ease: "none" }, 3.83 + i * 0.07);
      });
      tl.fromTo("#message", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 3.62);
      // 4.0+: small plane at right
      tl.fromTo("#plane .p", { x: 160, y: 20, opacity: 0 }, { x: -80, y: -10, opacity: 1, duration: 0.75, ease: "none" }, 4.0);
      tl.set(document.getElementById("root"), { opacity: 1 }, END);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
